org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP refuses non-ASCII project paths on Windows. This suppresses the early
# check, but AAPT2/Javac may still fail; docs/BUILDING.md recommends an ASCII
# staging directory. Kept so the original project can at least configure.
android.overridePathCheck=true
